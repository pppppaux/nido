# Nido se despliega en la misma VM que Alpha y con su inventario, sus group_vars y su
# vault: los secretos de Nido viven en el vault de Alpha (vault_nido_*), no en este repo,
# que es público para poder usar GitHub Pages. También reutiliza sus roles (WAF y límites).
[defaults]
inventory = ../../alpha/ansible/inventories/prod/hosts.yml
vault_password_file = ../../alpha/ansible/backend_pass.txt
roles_path = ../../alpha/ansible/roles
diff = True
host_key_checking = True
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
