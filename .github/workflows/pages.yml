# Publica la web en GitHub Pages en cada push a master que toque frontend/.
# La API no se despliega aquí: va a la VM con ansible (ansible/playbooks/nido.yml).
name: Web en Pages

on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # La web se sirve en https://<usuario>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: https://nido.alphaos.duckdns.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
